<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول | لوحة الإدارة</title>
  <style>
    :root {
      --bg: #070a13;
      --card-bg: rgba(15, 23, 42, 0.85);
      --border: rgba(56, 189, 248, 0.25);
      --primary: #38bdf8;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --font-sans: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-sans); }
    body {
      background: var(--bg); color: var(--text); display: flex;
      justify-content: center; align-items: center; min-height: 100vh; padding: 1rem;
    }
    .box {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 12px; padding: 2.5rem; width: 100%; max-width: 400px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5); text-align: center;
    }
    h2 { margin-bottom: 1.5rem; font-weight: 700; font-size: 1.4rem; }
    .form-group { margin-bottom: 1.2rem; text-align: right; }
    label { display: block; margin-bottom: 6px; color: var(--text-muted); font-size: 0.88rem; }
    .form-ctrl {
      width: 100%; padding: 10px 12px; background: #05070d; border: 1px solid var(--border);
      border-radius: 6px; color: #fff; outline: none; font-size: 0.95rem;
    }
    .form-ctrl:focus { border-color: var(--primary); }
    .btn-login {
      width: 100%; padding: 10px; background: var(--primary); border: none;
      border-radius: 6px; color: #070a13; font-weight: 700; font-size: 0.95rem;
      cursor: pointer; transition: 0.3s; margin-top: 0.5rem;
    }
    .btn-login:hover { background: #0284c7; color: #fff; }
    .alert-err {
      background: rgba(239, 68, 68, 0.15); border: 1px solid var(--danger);
      color: var(--danger); padding: 8px; border-radius: 6px; margin-bottom: 1rem;
      font-size: 0.85rem; display: none;
    }
    .back-link { display: inline-block; margin-top: 1.5rem; color: var(--text-muted); text-decoration: none; font-size: 0.85rem; }
    .back-link:hover { color: var(--primary); }
  </style>
</head>
<body>

  <div class="box">
    <h2>تسجيل دخول الإدارة</h2>
    <div id="alertBox" class="alert-err"></div>

    <form id="loginForm">
      <div class="form-group">
        <label>اسم المستخدم</label>
        <input type="text" id="username" class="form-ctrl" required autocomplete="off">
      </div>
      <div class="form-group">
        <label>كلمة المرور</label>
        <input type="password" id="password" class="form-ctrl" required>
      </div>
      <button type="submit" class="btn-login">تسجيل الدخول</button>
    </form>

    <a href="/" class="back-link">&larr; العودة للواجهة الرئيسية</a>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById('alertBox');
      alertBox.style.display = 'none';

      const formData = new FormData();
      formData.append('username', document.getElementById('username').value);
      formData.append('password', document.getElementById('password').value);

      try {
        const res = await fetch('/login', { method: 'POST', body: formData });
        const data = await res.json();
        if (res.ok && data.status === 'success') {
          window.location.href = '/admin';
        } else {
          alertBox.textContent = data.message || 'بيانات الدخول غير صحيحة';
          alertBox.style.display = 'block';
        }
      } catch (err) {
        alertBox.textContent = 'فشل الاتصال بالسيرفر';
        alertBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
